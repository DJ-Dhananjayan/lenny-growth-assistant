version: '3.8'

services:
  # PostgreSQL Database with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: lenny_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lenny_growth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenny_growth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lenny_backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/lenny_growth_db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DEFAULT_OLLAMA_MODEL=llama3.2
      - DEFAULT_PROVIDER=ollama
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # React Frontend Single Page Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lenny_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
